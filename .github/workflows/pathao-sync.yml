# Keeps WooCommerce order statuses in step with Pathao every 15 minutes.
# Vercel's free plan only allows daily cron jobs, so GitHub calls the sync
# endpoint instead. Needs the CRON_SECRET repository secret (same value as on Vercel).
name: Pathao order sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sync WooCommerce with Pathao
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://ecom-tau-pearl.vercel.app/api/cron/pathao-sync)
          cat response.json; echo
          test "$status" = "200"
